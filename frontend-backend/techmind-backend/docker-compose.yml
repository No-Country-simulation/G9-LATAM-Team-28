services:
  db:
    image: postgres:16-alpine
    container_name: techmind-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techmind}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-techmind}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techmind-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techmind-app
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-techmind}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-techmind_jwt_secret_key_for_development_and_testing_123456789}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://79.72.50.78:8000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - techmind-network

volumes:
  postgres_data:
    driver: local

networks:
  techmind-network:
    driver: bridge
