# TechMind Backend - Local Config
# NO usar caracteres especiales en este archivo

server.port=8080

# Servicio Machine Learning
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/techmind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

spring.profiles.active=dev
