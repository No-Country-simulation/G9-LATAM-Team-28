<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso / Registro | TechMind Enterprise</title>
  <!-- Tailwind CSS v4 Browser Build CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body
  class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 flex items-center justify-center p-4 sm:p-6 transition-colors duration-300">

  <!-- CONTENEDOR DE TOAST NOTIFICATIONS -->
  <div id="toastContainer" aria-live="polite"
    class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- CONTENIDO PRINCIPAL: LOGIN / REGISTRO (SIN BARRA LATERAL) -->
  <main class="w-full max-w-md my-auto">
    <div
      class="bg-slate-900/90 backdrop-blur-xl border border-cyan-500/20 rounded-2xl p-6 sm:p-8 shadow-2xl shadow-cyan-950/50 space-y-6">

      <div class="flex justify-between items-center pb-4 border-b border-cyan-500/20">
        <div class="flex items-center gap-3">
          <div class="text-cyan-400 drop-shadow-[0_0_8px_rgba(6,182,212,0.6)]">
            <i class="fa-solid fa-layer-group text-2xl"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg text-white tracking-tight">TechMind Enterprise</h1>
            <p class="text-[11px] text-slate-400">Portal de Autenticación de Usuarios</p>
          </div>
        </div>
        <button id="themeToggleDesktop" aria-label="Cambiar tema"
          class="p-2 text-slate-400 hover:text-cyan-300 hover:bg-cyan-500/10 rounded-full">
          <i id="themeMoonDesktop" class="fa-solid fa-moon text-lg"></i>
          <i id="themeSunDesktop" class="fa-solid fa-sun text-lg hidden text-amber-400"></i>
        </button>
      </div>

      <!-- PESTAÑAS LOGIN / REGISTRO -->
      <div class="flex bg-slate-950 p-1 rounded-xl border border-cyan-500/20">
        <button id="tabLogin"
          class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-950 bg-cyan-500 transition-all shadow-sm">Iniciar
          Sesión</button>
        <button id="tabRegister"
          class="flex-1 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all">Crear
          Cuenta</button>
      </div>

      <!-- FORMULARIO LOGIN -->
      <form id="formLogin" class="space-y-4" novalidate>
        <div class="space-y-1">
          <label for="loginEmail" class="text-xs font-semibold text-slate-200 uppercase tracking-wide">Correo
            Electrónico</label>
          <input type="email" id="loginEmail" placeholder="usuario@empresa.com" required
            class="w-full bg-slate-950/80 border border-cyan-500/30 focus:border-cyan-400 rounded-xl px-4 py-2.5 text-xs text-slate-100 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-cyan-500/40">
        </div>

        <div class="space-y-1">
          <div class="flex items-center justify-between">
            <label for="loginPassword"
              class="text-xs font-semibold text-slate-200 uppercase tracking-wide">Contraseña</label>

          </div>
          <div class="relative">
            <input type="password" id="loginPassword" placeholder="••••••••" required
              class="w-full bg-slate-950/80 border border-cyan-500/30 focus:border-cyan-400 rounded-xl pl-4 pr-10 py-2.5 text-xs text-slate-100 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-cyan-500/40">
            <button type="button" id="toggleLoginPass"
              class="absolute right-3 top-2.5 text-slate-400 hover:text-cyan-300 text-xs">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit"
          class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition-all shadow-lg shadow-cyan-500/20 active:scale-[0.99] flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Ingresar a TechMind
        </button>
      </form>

      <!-- FORMULARIO REGISTRO -->
      <form id="formRegister" class="space-y-4 hidden" novalidate>
        <div class="space-y-1">
          <label for="regName" class="text-xs font-semibold text-slate-200 uppercase tracking-wide">Nombre
            Completo</label>
          <input type="text" id="regName" placeholder="Gabriel Ramos" required
            class="w-full bg-slate-950/80 border border-cyan-500/30 focus:border-cyan-400 rounded-xl px-4 py-2.5 text-xs text-slate-100 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-cyan-500/40">
        </div>

        <div class="space-y-1">
          <label for="regEmail" class="text-xs font-semibold text-slate-200 uppercase tracking-wide">Correo
          </label>
          <input type="email" id="regEmail" placeholder="gabriel@empresa.com" required
            class="w-full bg-slate-950/80 border border-cyan-500/30 focus:border-cyan-400 rounded-xl px-4 py-2.5 text-xs text-slate-100 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-cyan-500/40">
        </div>

        <div class="space-y-1">
          <label for="regPassword" class="text-xs font-semibold text-slate-200 uppercase tracking-wide">Crear
            Contraseña</label>
          <div class="relative">
            <input type="password" id="regPassword" placeholder="••••••••" required
              class="w-full bg-slate-950/80 border border-cyan-500/30 focus:border-cyan-400 rounded-xl pl-4 pr-10 py-2.5 text-xs text-slate-100 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-cyan-500/40">
            <button type="button" id="toggleRegPass"
              class="absolute right-3 top-2.5 text-slate-400 hover:text-cyan-300 text-xs">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="w-full h-1 bg-slate-950 rounded-full overflow-hidden mt-1">
            <div id="passStrengthBar" class="h-full bg-rose-500 transition-all duration-300" style="width: 0%;"></div>
          </div>
        </div>

        <button type="submit"
          class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition-all shadow-lg shadow-cyan-500/20 active:scale-[0.99] flex items-center justify-center gap-2">
          <i class="fa-solid fa-user-plus"></i> Registrar Cuenta
        </button>
      </form>


    </div>
  </main>

  <script>
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const formLogin = document.getElementById('formLogin');
    const formRegister = document.getElementById('formRegister');
    const toastContainer = document.getElementById('toastContainer');

    function setupPasswordToggle(btnId, inputId) {
      const toggleBtn = document.getElementById(btnId);
      const passInput = document.getElementById(inputId);

      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passInput.type === 'password';
          passInput.type = isPassword ? 'text' : 'password';
          const icon = toggleBtn.querySelector('i');
          if (icon) {
            icon.classList.toggle('fa-eye', !isPassword);
            icon.classList.toggle('fa-eye-slash', isPassword);
          }
        });
      }
    }

    setupPasswordToggle('toggleLoginPass', 'loginPassword');
    setupPasswordToggle('toggleRegPass', 'regPassword');

    // Indicador dinámico de fortaleza de contraseña
    const regPassInput = document.getElementById('regPassword');
    const passStrengthBar = document.getElementById('passStrengthBar');
    if (regPassInput && passStrengthBar) {
      regPassInput.addEventListener('input', () => {
        const val = regPassInput.value;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score++;

        if (val.length === 0) {
          passStrengthBar.style.width = '0%';
          passStrengthBar.className = 'h-full bg-slate-700 transition-all duration-300';
        } else if (score <= 1) {
          passStrengthBar.style.width = '25%';
          passStrengthBar.className = 'h-full bg-rose-500 transition-all duration-300';
        } else if (score === 2) {
          passStrengthBar.style.width = '50%';
          passStrengthBar.className = 'h-full bg-amber-500 transition-all duration-300';
        } else if (score === 3) {
          passStrengthBar.style.width = '75%';
          passStrengthBar.className = 'h-full bg-cyan-500 transition-all duration-300';
        } else {
          passStrengthBar.style.width = '100%';
          passStrengthBar.className = 'h-full bg-emerald-500 transition-all duration-300';
        }
      });
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = 'flex items-center gap-3 p-3.5 rounded-xl border border-cyan-500/30 text-xs font-semibold bg-cyan-950/95 text-cyan-200';
      toast.innerHTML = `<i class="fa-solid fa-circle-info text-cyan-400 text-sm"></i><span class="flex-1">${message}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    function setTheme(isLight) {
      if (isLight) {
        document.body.classList.add('light-mode');
        document.getElementById('themeMoonDesktop')?.classList.add('hidden');
        document.getElementById('themeSunDesktop')?.classList.remove('hidden');
        localStorage.setItem('theme', 'light');
      } else {
        document.body.classList.remove('light-mode');
        document.getElementById('themeMoonDesktop')?.classList.remove('hidden');
        document.getElementById('themeSunDesktop')?.classList.add('hidden');
        localStorage.setItem('theme', 'dark');
      }
    }
    document.getElementById('themeToggleDesktop')?.addEventListener('click', () => {
      const isLight = document.body.classList.contains('light-mode');
      setTheme(!isLight);
      showToast(!isLight ? "Modo Claro activado" : "Modo Oscuro activado", "info");
    });
    if (localStorage.getItem('theme') === 'light') setTheme(true);

    tabLogin.addEventListener('click', () => {
      tabLogin.className = 'flex-1 py-2 rounded-lg text-xs font-bold text-slate-950 bg-cyan-500 transition-all shadow-sm';
      tabRegister.className = 'flex-1 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all';
      formLogin.classList.remove('hidden');
      formRegister.classList.add('hidden');
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.className = 'flex-1 py-2 rounded-lg text-xs font-bold text-slate-950 bg-cyan-500 transition-all shadow-sm';
      tabLogin.className = 'flex-1 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all';
      formRegister.classList.remove('hidden');
      formLogin.classList.add('hidden');
    });

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        showToast("Ingresa tu correo y contraseña.", "warning");
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({ message: "Credenciales inválidas" }));
          throw new Error(errData.message || "Error al iniciar sesión");
        }

        const data = await res.json();
        if (data.token) {
          localStorage.setItem('techmind_token', data.token);
          localStorage.setItem('techmind_user', JSON.stringify(data));
          showToast(`¡Bienvenido de nuevo, ${data.nombre || email}!`, "success");
          setTimeout(() => window.location.href = "index.html", 800);
        } else {
          throw new Error("Token no recibido del servidor");
        }
      } catch (err) {
        showToast(err.message || "Error de autenticación. Verifique sus credenciales.", "error");
      }
    });

    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!email || !password) {
        showToast("Por favor completa el correo y contraseña.", "warning");
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password })
        });

        if (!res.ok) {
          const errData = await res.text().catch(() => "Error en el registro");
          throw new Error(errData || "Error al registrar cuenta");
        }

        const data = await res.json();
        if (data.token) {
          localStorage.setItem('techmind_token', data.token);
          localStorage.setItem('techmind_user', JSON.stringify(data));
          showToast("Cuenta registrada exitosamente. Redirigiendo...", "success");
          setTimeout(() => window.location.href = "index.html", 800);
        }
      } catch (err) {
        showToast(err.message || "No se pudo registrar la cuenta.", "error");
      }
    });

    // Redirigir si el usuario ya inició sesión
    if (localStorage.getItem('techmind_token')) {
      window.location.href = "index.html";
    }
  </script>
</body>

</html>
